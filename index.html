<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter Website By Malik Tashfeen Rizvi</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .counter-box {
      background: white;
      padding: 40px;
      width: 350px;
      text-align: center;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin-bottom: 25px;
      color: #333;
    }

    #count {
      font-size: 70px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 30px;
    }

    button {
      border: none;
      padding: 12px 20px;
      margin: 5px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .increase {
      background: #28a745;
    }

    .decrease {
      background: #dc3545;
    }

    .reset {
      background: #333;
    }
  </style>
</head>

<body>

  <div class="counter-box">
    <h1>Counter</h1>

    <div id="count">0</div>

    <button class="decrease" onclick="decrease()">−</button>
    <button class="reset" onclick="reset()">Reset</button>
    <button class="increase" onclick="increase()">+</button>
  </div>

  <script>
    let count = 0;

    const countDisplay = document.getElementById("count");

    function updateDisplay() {
      countDisplay.textContent = count;
    }

    function increase() {
      count++;
      updateDisplay();
    }

    function decrease() {
      count--;
      updateDisplay();
    }

    function reset() {
      count = 0;
      updateDisplay();
    }
  </script>

</body>
</html>
